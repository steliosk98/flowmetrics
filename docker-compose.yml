name: flowmetrics
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmetrics}
      POSTGRES_USER: ${POSTGRES_USER:-flowmetrics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
  flowmetrics:
    build: .
    image: ${FLOWMETRICS_IMAGE:-flowmetrics:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLOWMETRICS_PORT: 3000
      TZ: ${TZ:-UTC}
      AUTH_MODE: ${AUTH_MODE:-local}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-true}
      STORE_RAW_PAYLOADS: ${STORE_RAW_PAYLOADS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-flowmetrics}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-flowmetrics}
    ports:
      - "${FLOWMETRICS_PORT:-3000}:3000"
    volumes:
      - flowmetrics_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  postgres_data:
  flowmetrics_data:
